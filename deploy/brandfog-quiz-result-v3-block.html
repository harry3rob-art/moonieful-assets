     FOUR THINGS THE TOKEN REMAP ALONE DID NOT CATCH
     1. #bfr-root hardcoded background: radial-gradient(... #1a4f5c, #0d2f38,
        #1A2E35), which OVERRIDES var(--deep). Left alone, the page stays dark
        no matter what the token says. Now background: var(--deep).
     2. #bfr-root sets the default text colour to var(--white), invisible on a
        white page. Now var(--ink).
     3. TWO blurred decorative orbs, one teal and one gold, part of the dark
        shell. On white they render as coloured smudges. The gold one only
        showed up in a screenshot, not in any colour audit. Both display:none.
     4. The STARFIELD canvas. Stars only work on a dark ground. The canvas is
        HIDDEN rather than deleted, so the Starfield() call still finds its
        element and the script stays byte-identical.

     Gold is never a word here either: #D4AF37 measures 2.10 on white and fails
     even as large text, so .result-reveal, .result-score-number (56px) and
     .result-opening moved to deep teal. The score bar was a teal-to-gold
     gradient; a progress bar is meaningful non-text content needing 3:1, and
     the gold end failed, so it is now teal to #1583B3 (4.26 on white).
     'Caveat' on .brand-mark was also retired; now Shantell Sans.

<script>
  // Shared fixed identity-bridge copy (beat 5). Same for all four generating types.
  // Additive, evidence-based, gender-neutral. Hidden for nr.
  var IDENTITY_BRIDGE = "You didn't scroll past this page. You stopped, you looked, and you put words to what you want your work to say, and that says something about you: you act on what you notice instead of sitting on it. You're allowed to want a business that works as well as you do, and you're allowed to get help seeing the part of it you can't see alone.";

    ie: {

      bookBridge: "I call what you just saw in the mirror Brand Fog, and there's a whole pattern behind why the fog forms and what the fog is costing you. The book walks through that pattern for the exact reflection you got. Short read, $17."
    },
    tb: {
      typeName: "the Trapped Builder",
      strengthFallback: "You built a real thing, and people trust you personally to carry it. That trust is earned, and it's a strength most founders never reach.",
      patternFallback: "That same trust is why your message quietly says hire me and I'll handle it. Because you're the engine, nothing pre-sells before you arrive, so every new client still gets the full explanation from you, live. The calls stack onto your week, and stepping away for a few days costs more than it should.",

      nameLine: "There's a name for this pattern. I think of it as the Trapped Builder.",
      bookBridge: "I call what you just saw in the mirror Brand Fog, and there's a whole pattern behind why the fog forms and what the fog is costing you. The book walks through that pattern for the exact reflection you got. Short read, $17."
    },
    bv: {
      typeName: "the Blurred Visionary",
      strengthFallback: "You hold a big, clear, original vision. You see the whole picture, and that kind of sight is rare.",

      moveFallback: "Name the one outcome of your vision a stranger can picture immediately, and put it before the full vision. The narrow doorway is what makes you stand out and clears the blur, without shrinking anything you can see.",

    },
    nr: {
      typeName: "",
      strengthFallback: "Your strength is already reaching strangers. The people who find you can see your work clearly, and the right clients are saying yes without you having to convince them.",
      patternFallback: "There's no fog between you and them right now. You're getting the right clients, charging what your work is worth, and moving in the direction you planned.",
      moveFallback: "This reflection is for the moment when you sense something's off but can't name it yet. If that's not where you are today, this isn't the right read for you right now. If something shifts, come back and look again.",
      nameLine: "",
      bookBridge: ""
    }
  };

  (function () {
    // AI-generated reflection REMOVED (Harry, 2026-07-18): the live generation added a
    // dependency and ~14s of wait for a page that already carries strong per-type copy.
    // The reflection now always renders from the static per-type text below.
    var MIN_LOADING_MS = 2200;   // intentional "the mirror is looking at you" minimum
    var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var LOADING_LABELS = [
      "Reading your answers…",
      "Finding what makes you stand out…",
      "Almost there…"
    ];
    var loadingLabelTimers = [];

    function startLoadingAnimation() {
      var fill = document.getElementById('bfr-loading-fill');
      var text = document.getElementById('bfr-loading-text');
      // Phase 1: fill toward 88% over the MIN_LOADING_MS window.
      requestAnimationFrame(function () { fill.style.transform = 'scaleX(0.88)'; });

      // Rotate labels with a short opacity crossfade; last label holds if generation runs long.
      var scheduleLabel = function (label, delay) {
        var id = setTimeout(function () {
          text.style.opacity = '0';
          setTimeout(function () {
            text.textContent = label;
            text.style.opacity = '1';
          }, 250);
        }, delay);
        loadingLabelTimers.push(id);
      };
      scheduleLabel(LOADING_LABELS[1], 900);
      scheduleLabel(LOADING_LABELS[2], 1800);

      // Phase 2: if still waiting past MIN_LOADING_MS, creep further toward 96% slowly.
      var creepId = setTimeout(function () {
        if (!prefersReducedMotion) {
          fill.style.transition = 'transform 6000ms cubic-bezier(0.16, 1, 0.3, 1)';
        }
        fill.style.transform = 'scaleX(0.96)';
      }, MIN_LOADING_MS);
      loadingLabelTimers.push(creepId);
    }

    function finishLoadingAnimation() {
      loadingLabelTimers.forEach(clearTimeout);
      loadingLabelTimers = [];
      var fill = document.getElementById('bfr-loading-fill');
      if (!prefersReducedMotion) {
        fill.style.transition = 'transform 200ms ease-out';
      }
      fill.style.transform = 'scaleX(1)';
    }

    var urlParams = new URLSearchParams(window.location.search);
    var rawType = urlParams.get('type') || localStorage.getItem('fogResult');
    var fogKey = rawType || 'ie';
    if (rawType && fogKey !== 'nr') localStorage.setItem('fogResult', fogKey);
    if (rawType && fogKey !== 'nr') localStorage.setItem('reflectionDone', 'true');
    var sentence = urlParams.get('reflection') || localStorage.getItem('reflectionSentence') || '';
    var answers = readAnswers(urlParams);
    var t = Object.prototype.hasOwnProperty.call(bfrReflectionTypes, fogKey) ? bfrReflectionTypes[fogKey] : bfrReflectionTypes.ie;
    var started = Date.now();
    startLoadingAnimation();

    function readAnswers(p) {
      var raw = p.get('answers') || localStorage.getItem('reflectionAnswers') || '';
      if (!raw) return [];
      try {
        var a = JSON.parse(raw);
        return Array.isArray(a) ? a.filter(function (x) { return typeof x === 'string'; }) : [];
      } catch (e) { return []; }
    }

    function strengthOpening(mirror) {
      if (mirror) return mirror;
      return t.strengthFallback || '';
    }

    function renderBeats(mirror, pattern, move) {
      document.getElementById('bfr-result-opening').textContent = strengthOpening(mirror);

      var nameEl = document.getElementById('bfr-result-nameline');
      if (t.nameLine) { nameEl.textContent = t.nameLine; } else { nameEl.style.display = 'none'; }

      var descEl = document.getElementById('bfr-result-description');
      descEl.textContent = '';
      var p = document.createElement('p');
      p.textContent = pattern;
      descEl.appendChild(p);

      document.getElementById('bfr-result-move').textContent = move;

      var identityEl = document.getElementById('bfr-result-identity');
      if (fogKey === 'nr') { identityEl.style.display = 'none'; }
      else { document.getElementById('bfr-identity-body').textContent = IDENTITY_BRIDGE; }

      if (fogKey === 'nr' || !t.bookBridge) {
        document.getElementById('bfr-result-bridge').style.display = 'none';
      } else {
        document.getElementById('bfr-bridge-body').textContent = t.bookBridge;
      }

      finishLoadingAnimation();
      document.getElementById('bfr-loading').style.display = 'none';
      document.getElementById('bfr-content').style.display = 'block';
    }

    function renderFallback() { renderBeats(t.strengthFallback, t.patternFallback, t.moveFallback); }

    function afterMin(fn) {
      var wait = Math.max(0, MIN_LOADING_MS - (Date.now() - started));
      setTimeout(fn, wait);
    }

    // All types render the static per-type reflection. No network dependency.
    afterMin(renderFallback);
  })();

  (function(){
    function Starfield(canvas,count,speed){var ctx=canvas.getContext('2d'),stars=[];function resize(){var p=canvas.parentElement;canvas.width=p.offsetWidth;canvas.height=p.offsetHeight;}function init(){resize();stars=[];for(var i=0;i<count;i++){stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.4+0.3,t:Math.random()*Math.PI*2,ts:(Math.random()*0.015+0.005)*speed});}}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(var i=0;i<stars.length;i++){var s=stars[i];s.t+=s.ts;var op=0.25+Math.abs(Math.sin(s.t))*0.75;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+op+')';ctx.fill();if(s.r>1.1){var arm=s.r*3,sp=(op-0.3)*0.5;if(sp>0){ctx.strokeStyle='rgba(210,245,241,'+sp+')';ctx.lineWidth=0.6;ctx.beginPath();ctx.moveTo(s.x-arm,s.y);ctx.lineTo(s.x+arm,s.y);ctx.moveTo(s.x,s.y-arm);ctx.lineTo(s.x,s.y+arm);ctx.stroke();}}}requestAnimationFrame(draw);}window.addEventListener('resize',init);init();draw();}
    var c=document.getElementById('bfr-canvas');if(c)Starfield(c,100,0.9);
  })();
</script>
